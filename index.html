<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D4F4B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Claudix" />
  
  <title>Claudix — Your Personal Digital Space</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0D4F4B;
    }
    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzMk0EfEE9CKj7oHmGD9Y6SVUCO-owVuvkAsFKhikApaAxztuXnDroIqZV1iZdd-NABqQ/exec"
    allow="clipboard-read; clipboard-write; camera; microphone; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    (function() {
      const search = window.location.search;
      if (search) {
        const frame = document.getElementById('appFrame');
        frame.src = frame.src + search;
      }
    })();
  </script>
</body>
</html>
