<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0D4F4B" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Claudix" />

  <title>Claudix — Your Personal Digital Space</title>
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzMk0EfEE9CKj7oHmGD9Y6SVUCO-owVuvkAsFKhikApaAxztuXnDroIqZV1iZdd-NABqQ/exec"
    allow="clipboard-read; clipboard-write; camera; microphone; fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    (function() {
      const search = window.location.search;
      if (search) {
        const frame = document.getElementById('appFrame');
        frame.src = frame.src + search;
      }
    })();
  </script>
</body>
</html>
