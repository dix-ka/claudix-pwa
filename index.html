<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CLAUDIX — Your Personal Digital Space</title>

  <!-- Warna status bar atas (ikon baterai/jam) menyesuaikan tema terang & gelap -->
  <meta name="theme-color" content="#F7F9F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111918" media="(prefers-color-scheme: dark)">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CLAUDIX">

  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
  <link rel="shortcut icon" type="image/png" href="/icon-512.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
  <link rel="manifest" href="/manifest.json">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Warna ini yang akan muncul di belakang ikon baterai & jam */
      background-color: #F7F9F8;
      /* Jarak aman atas & bawah agar konten iframe tidak ketarik atau kepotong */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #111918; }
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    src="https://script.google.com/macros/s/AKfycbzMk0EfEE9CKj7oHmGD9Y6SVUCO-owVuvkAsFKhikApaAxztuXnDroIqZV1iZdd-NABqQ/exec" 
    allow="camera; microphone; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
</body>
</html><!DOCTYPE html>
